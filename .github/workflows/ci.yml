name: CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

permissions:
  contents: read

# Do not interrupt a deployment midway through replacement/rollback.
concurrency:
  group: kratos-frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint

  test:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build production image and smoke test routes/assets/version
        run: |
          docker build --build-arg APP_REVISION="$GITHUB_SHA" -t kratos-frontend:test .
          bash ci/smoke_frontend.sh kratos-frontend:test "$GITHUB_SHA"
      - name: Save the tested image for publishing
        run: docker save kratos-frontend:test | gzip > /tmp/frontend-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: tested-frontend-image
          path: /tmp/frontend-image.tar.gz
          retention-days: 1

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/dev' && github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: tested-frontend-image
          path: /tmp/tested-image
      - name: Publish the exact image that passed smoke tests
        id: image
        if: github.ref == 'refs/heads/dev' && github.event_name != 'pull_request'
        run: |
          gzip -dc /tmp/tested-image/frontend-image.tar.gz | docker load
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          docker tag kratos-frontend:test "$image"
          docker push "$image"
          digest=$(docker inspect "$image" --format '{{index .RepoDigests 0}}' | cut -d@ -f2)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/dev' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: dev
      url: https://kratos.qzz.io
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Check whether this is still the latest dev commit
        id: current
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/dev" --jq '.object.sha')
          echo "deploy=$([[ "$latest" == "$GITHUB_SHA" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Deploy verified image with health check and rollback
        if: steps.current.outputs.deploy == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_IMAGE: ghcr.io/chanhsing1972/kratos-frontend@${{ needs.build-and-push.outputs.digest }}
        run: bash ci/deploy_github.sh
      - name: Verify public website
        if: steps.current.outputs.deploy == 'true'
        run: python ci/check_public.py "$GITHUB_SHA"
